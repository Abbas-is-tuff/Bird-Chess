<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bird Chess</h1>
    <p class="tagline">Same rules as chess. Way more feathers.</p>
  </header>

  <main>
    <section class="play">
      <div class="player-bar" id="bar-top">
        <span class="flock-name" id="name-top"></span>
        <span class="caught" id="caught-top"></span>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
        <div id="promo" class="promo hidden" role="dialog" aria-label="Choose promotion">
          <p>Your chick has grown up! Pick a bird:</p>
          <div class="promo-choices" id="promo-choices"></div>
        </div>
      </div>

      <div class="player-bar" id="bar-bottom">
        <span class="flock-name" id="name-bottom"></span>
        <span class="caught" id="caught-bottom"></span>
      </div>
    </section>

    <aside class="side">
      <div id="status" class="status" aria-live="polite"></div>

      <div class="controls">
        <label>Mode
          <select id="mode">
            <option value="ai">vs Computer</option>
            <option value="pvp">2 players (same screen)</option>
          </select>
        </label>
        <label id="level-wrap">Computer
          <select id="level">
            <option value="1">Hatchling (easy)</option>
            <option value="2" selected>Fledgling (medium)</option>
            <option value="3">Raptor (hard)</option>
          </select>
        </label>
        <label id="side-wrap">You play
          <select id="side">
            <option value="w">Dawn flock (moves first)</option>
            <option value="b">Dusk flock</option>
          </select>
        </label>
        <div class="buttons">
          <button id="new">New game</button>
          <button id="undo">Undo</button>
          <button id="flip">Flip board</button>
          <button id="sound" aria-pressed="true">Chirps: on</button>
        </div>
      </div>

      <details class="legend" open>
        <summary>Meet the flock</summary>
        <ul id="legend"></ul>
      </details>

      <div class="history">
        <h2>Flight log</h2>
        <ol id="history"></ol>
      </div>
    </aside>
  </main>

  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
